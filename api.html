   <!DOCTYPE html>
<html lang="en">
<head>
    
    <title>API</title>

    <style>
        

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .chat-container {
            width: 90%;
            max-width: 650px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: darkorchid;
            margin-bottom: 50px;
            font-style: italic ;
            font-size: 50px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #input_text {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #input_text:focus {
            border-color: #667eea;
        }

        button {
        /* width: 50%; */
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f5ed1;
        }

        #response_box {
            margin-top: 25px;
            padding: 20px;
            min-height: 100px;
            background: #f4f4ff;
            border-radius: 12px;
            color: #333;
            white-space: pre-wrap;
        }

        .loading {
            color: #777;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .input-area {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
        table{
            border-collapse: collapse;
            width: 50px;
        }
        .table-container{
            overflow-x: auto;
            border-collapse: collapse;
        }
        th{
            background: #764ba2;
            padding: 50px;
        }
        td{
            padding: 50px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <h1>🤖 API</h1>

      

            <label type="text">Enter your text</label>

            <input
                type="text"
                id="input_text"
                placeholder="Enter your question..."
            >

            <button onclick="sendRequest()">
            submit
            </button>

    

        <!-- Response -->
        <div id="response_box">
            Your AI response will appear here...
        </div>

    
    <table>
    <p id="status"></p>
    <div class="table-container">
        <tr>
        <th>name</th>
        <th>age</th>
        <th>city</th>
        <th>status</th>
</tr>
<tr>
    <td>padmini</td>
    <td>25</td>
    <td>koyyuru</td>
    <td>unmarried</td>
</tr>
<tr>
    <td>sai</td>
    <td>23</td>
    <td>bakuluru</td>
    <td>unmarried</td>
</tr>
    </table>
</div>


    <script>

        async function sendRequest() {

            // Get user input
            const usr_input = document.getElementById("input_text").value;

            // Check empty input
            if (usr_input.trim() === "") {
                alert("Please enter a question.");
                return;
            }

            // Show loading
            document.getElementById("response_box").innerHTML =
                "<span class='loading'>Thinking... 🤔</span>";

            try {

                // Send request to backend
                const response = await fetch(
                    "https://3h0jj9j1-5000.inc1.devtunnels.ms/ask_my_llm",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            input: usr_input
                        })
                    }
                );

                // Check response
                if (!response.ok) {
                    throw new Error(
                        "Server error: " + response.status
                    );
                }

                // Convert response to JSON
                const result = await response.json();

                console.log(result);

                // Display result
                document.getElementById("response_box").innerText =
                    result.response || result.answer || JSON.stringify(result);

            } catch (error) {

                console.error(error);

                document.getElementById("response_box").innerText =
                    "❌ Error connecting to the server.\n\n" +
                    error.message;
            }
        }


        // Allow Enter key to send
        document.getElementById("input_text").addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    sendRequest();
                }

            }
        );

    </script>

</body>
</html>
