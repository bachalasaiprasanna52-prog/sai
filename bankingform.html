<html>
<head>
    <title>Banking Form</title>
    <style>
        body {
          font-family: arial;
          margin: 0;
          padding:30px;
        }
        form{
            width: 700px;
            margin: 30px;
            padding: 30px;
            background:white;
            box-shadow: 10px;
        }
        h1{
            text-align: center;
            color:darkblue
        
        }
        p{
            text-align: center;
        }
        h2{
           background: lightblue; 
            color:rgb(13, 148, 193);
            padding: 5px;
        }
        label{
            font-size: 15px;
            font-weight:bold;
             display:inline-block ; 
            width: 100px;
        }
        input,select{
        padding: 10px;
    width: 200px;
    margin-right: 30px;
        }
         .button{
            padding: 9px;
            margin: 20px;
            text-align: center;
        }
        .submit {
            background-color: darkgreen;
          border-radius: 200px;
          width: 60px;
            
        } 
         .reset{
            background-color: red;
            border-radius: 200px;
        }
        
        
    </style>
</head>
<center><body>
<form>
<h1>Bank Account Opening Form</h1>
<p>Fill in the details below to open your new bank account</p>
<h2>Personal Details</h2>
<label>Full Name</label>
<input type="text"id="name"placeholder="Enter your name">
<label>Date of birth</label>
<input type="date"id="dob"><br></br>
<label>Gender</label>
<select id="gender">
 <option value="male">male</option>
 <option value="female">female</option>
</select>
 <label>mobile Number</label>
 <input type="tel"id="mobile" maxlength="10"required placeholder="Enter 10 digit mobilenumber"><br></br>
 <label>Email addrss</label>
 <input type="email"id="email" placeholder="Enter your email address">
 <label>PAN Number</label>
 <input type="tel"id="number"placeholder="Enter your PAN number">
 <h2>Account Details</h2>
 <label>Account Type</label>
 <input type="text"id="name"placeholder="select Account Type">
 <label>Initial Deposit Amount</label>
 <input type="number"id="number"placeholder="Enter amount (e.g.1000)">
 <h2>Address Details</h2>
 <label>House/Street Address</label>
 <input type="text"id="text"placeholder="Enter your address">
 <label>City</label>
 <input type="text"id="text"placeholder="Enter your city"><br></br>
 <label>State</label>
<select type="state">
    <option value="andhrapradesh">andhrapradesh</option>
    <option value="telangana">telangana</option>
    <option value="tamilnadu">tamilnadu</option>
</select>
<label>PIN Code</label>
<input type="tel"id="number"placeholder="Enter 6 digit PIN code"><br></br>
<div class="button">
<button class="submit">Submit</button>
<button class="reset">Reset</button>
</div>
</form>
</body></center>
</html>
